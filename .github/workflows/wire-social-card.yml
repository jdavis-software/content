name: Wire and verify approved social preview
on:
  push:
    branches: [feature/social-preview-card]
    paths: ['.github/workflows/wire-social-card.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only exact pretested source edits
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
