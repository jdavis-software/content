              assert hashlib.sha256(p.read_bytes()).hexdigest() == op['before'], 'Base changed: ' + str(p)
              text = p.read_text()
              for start, end, replacement in reversed(op['edits']):
                  text = text[:start] + replacement + text[end:]
              assert hashlib.sha256(text.encode()).hexdigest() == op['after'], 'Prepared output mismatch: ' + str(p)
