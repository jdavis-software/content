name: Deploy approved site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify both public articles, feeds, social images, and browser assets
        run: python3 scripts/verify-publication.py
      - name: Verify the new database roles section on the public article
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = 'https://jdavis-software.github.io/content/articles/keeping-parallel-development-fast/'
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      assert response.status == 200
                      html = response.read().decode('utf-8')
                  for text in ['id="not-every-database-is-another-source-of-truth"', 'Temporal-owned PostgreSQL persistence', 'Optional SQLite FTS index', 'approved documents → a versioned knowledge package → an optional SQLite index', 'The SQLite index is optional too.', 'https://www.sqlite.org/fts5.html']:
                      assert text in html, 'Missing article clarification: ' + text
                  print('VERIFIED public database ownership section, document-derived SQLite index, optional status, and citation')
                  break
              except Exception:
                  if attempt == 7:
                      raise
                  time.sleep(5)
          PY
