name: Deploy approved site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[loops-cover-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify all public articles, feeds, social images, and browser assets
        run: python3 scripts/verify-publication.py
      - name: Verify the approved colorful cover is the public article hero
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, urllib.request
          from urllib.parse import urljoin
          from html.parser import HTMLParser
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'img': self.images.append(dict(attrs).get('src', ''))
          base = 'https://jdavis-software.github.io'
          route = '/content/articles/loops-inside-graphs/'
          path = route + 'assets/og-loops-graphs-v2.png'
          with urllib.request.urlopen(base + route, timeout=20) as r:
              assert r.status == 200
              html = r.read().decode()
          parser = Images(); parser.feed(html)
          assert base + path in [urljoin(base + route, src) for src in parser.images], 'Article still references old cover'
          assert not any('og-loops-graphs-v1.png' in src for src in parser.images)
          with urllib.request.urlopen(base + path, timeout=20) as r:
              assert r.status == 200 and r.headers.get_content_type() == 'image/png'
              data = r.read()
          assert struct.unpack('>II', data[16:24]) == (1672, 941)
          assert hashlib.sha256(data).hexdigest() == '5d00f74830c9f5addc0667262223abd9c94e46559c5358639c226701ca872859'
          assert hashlib.sha256(pathlib.Path('articles/loops-inside-graphs/article.md').read_bytes()).hexdigest() == 'b55492ec3b8bda203fb00fb2ec38edf33caa82c104f7fec231a99c9b00d6062f'
          print('VERIFIED live colorful hero and social image, 1672x941, exact PNG bytes, unchanged article.')
          print(base + path)
          PY
      - name: Verify the database roles section remains on article two
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = 'https://jdavis-software.github.io/content/articles/keeping-parallel-development-fast/'
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      assert response.status == 200
                      html = response.read().decode('utf-8')
                  for text in ['id="not-every-database-is-another-source-of-truth"', 'Temporal-owned PostgreSQL persistence', 'Optional SQLite FTS index', 'approved documents → a versioned knowledge package → an optional SQLite index', 'The SQLite index is optional too.', 'https://www.sqlite.org/fts5.html']:
                      assert text in html, 'Missing article clarification: ' + text
                  print('VERIFIED public database ownership section, document-derived SQLite index, optional status, and citation')
                  break
              except Exception:
                  if attempt == 7:
                      raise
                  time.sleep(5)
          PY
