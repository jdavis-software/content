name: Deploy approved site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify public article and exact animation assets
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, time, urllib.request
          base = 'https://jdavis-software.github.io/content/'
          paths = ['articles/parallel-agent-engineering/', 'agent-flow.js', 'agent-flow-model.js', 'agent-flow.css', 'devops-flow.js', 'devops-model.js', 'devops-flow.css', 'vendor/anime-4.5.0.esm.min.js']
          for attempt in range(8):
              try:
                  for route in paths:
                      url = base + route + '?release=' + os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url, timeout=20) as response:
                          assert response.status == 200
                          data = response.read()
                      if route.endswith('/'):
                          assert b'id="parallel-agent-flow"' in data, 'Agent diagram not served yet'
                          assert b'id="devops-invalidation"' in data, 'DevOps diagram not served yet'
                          assert b'DriftGate' not in data
                      else:
                          expected = pathlib.Path('site', route).read_bytes()
                          assert hashlib.sha256(data).digest() == hashlib.sha256(expected).digest(), 'Stale asset: ' + route
                      print('VERIFIED 200', route)
                  break
              except Exception as error:
                  if attempt == 7: raise
                  print('Waiting for Pages propagation:', type(error).__name__)
                  time.sleep(5)
          PY
