name: Prepare article social card
on:
  push:
    branches: [feature/article-social-card]
    paths: ['.github/workflows/prepare-social-card.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import the approved public social image and verify bytes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, urllib.request
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3GItM2y2AvmPfI5GF1fDy6mhorh/2a91497b-04a0-43dd-8c5d-ba736d337b0e.png'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == '3544eead1440283b4730b7d2d73510e80eba96900b0b23112b0247f54e1e19a2'
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1200, 627)
          dest = pathlib.Path('articles/parallel-agent-engineering/assets/og-linkedin-v1.png')
          dest.write_bytes(data)
          print('Verified 1200x627 PNG:', len(data), 'bytes')
          PY
      - name: Commit only the image to the feature branch
        run: |
          git add articles/parallel-agent-engineering/assets/og-linkedin-v1.png
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: add generated 1200x627 article social card'
          git push origin HEAD:feature/article-social-card
          git archive --format=zip HEAD -o /tmp/social-card-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: social-card-source
          path: /tmp/social-card-source.zip
          retention-days: 2
