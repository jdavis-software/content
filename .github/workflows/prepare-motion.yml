name: Prepare motion asset
on:
  push:
    branches: [feature/animated-agent-flow]
    paths: [.github/workflows/prepare-motion.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned upstream files and verify Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          curl --fail --location --retry 2 https://raw.githubusercontent.com/juliangarnier/anime/v4.5.0/dist/bundles/anime.esm.min.js -o site/vendor/anime-4.5.0.esm.min.js
          curl --fail --location --retry 2 https://raw.githubusercontent.com/juliangarnier/anime/v4.5.0/LICENSE.md -o site/vendor/ANIME-LICENSE.txt
          test "$(git hash-object site/vendor/anime-4.5.0.esm.min.js)" = c278b15616623e2b32ef499bbb1020b181324d59
          test "$(git hash-object site/vendor/ANIME-LICENSE.txt)" = f999fa58ebdda6d8d0f3ae581ebdfe821f09603a
          sha256sum site/vendor/anime-4.5.0.esm.min.js site/vendor/ANIME-LICENSE.txt > site/vendor/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/vendor/anime-4.5.0.esm.min.js site/vendor/ANIME-LICENSE.txt site/vendor/SHA256SUMS.txt
          git commit -m 'build: vendor verified Anime.js 4.5.0 and MIT license'
          git push origin HEAD:feature/animated-agent-flow
      - name: Package source for offline verification
        run: git archive HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: motion-source
          path: source.zip
          retention-days: 2
