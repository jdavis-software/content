name: Validate content and site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Build review artifact
        run: npm run studio -- build --preview
      - uses: actions/upload-artifact@v4
        with:
          name: content-review
          path: .studio/preview/
          include-hidden-files: true
          retention-days: 7
