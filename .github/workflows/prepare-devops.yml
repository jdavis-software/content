name: Prepare DevOps source snapshot
on:
  push:
    branches: [feature/interactive-devops]
    paths: ['.github/workflows/prepare-devops.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/devops-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: devops-source
          path: /tmp/devops-source.zip
          retention-days: 2
