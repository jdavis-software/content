function volumeChart(){const data=chartData(),max=Math.max(4,...data.map(b=>b.complete+b.denied+b.wait+b.unknown)),top=Math.ceil(max/4)*4;let svg=`<svg viewBox="0 0 620 210" role="img" aria-label="Sample action outcomes in six time buckets. A data table is available below."><text x="12" y="13" class="axis">ACTIONS</text>`;for(let i=0;i<5;i++){const y=30+i*34;svg+=`<path class="gridline" d="M37 ${y}H610"/><text x="27" y="${y+3}" text-anchor="end">${Math.round(top*(1-i/4))}</text>`;}data.forEach((b,i)=>{let x=64+i*92,y=166;for(let k of ['complete','denied','wait','unknown']){let h=b[k]/top*136;if(h){svg+=`<rect class="series-${k}" x="${x}" y="${y-h}" width="40" height="${h}" rx="2"><title>${b.label} ago: ${k} ${b[k]}</title></rect>`;y-=h;}}svg+=`<text x="${x+20}" y="185" text-anchor="middle">${b.label} ago</text>`;});svg+='</svg>';return `<div class="chart">${svg}</div><div class="chart-footer"><div class="legend"><span><i class="swatch"></i>Completed</span><span><i class="swatch denied"></i>Denied / failed</span><span><i class="swatch wait"></i>Approval</span><span><i class="swatch unknown"></i>Unknown</span></div><button class="table-toggle" data-act="chart-table">Data table</button></div>`;}

const dialog=document.getElementById('dialog');let previousFocus=null;

function targetDialog(id){const t=targetById(id);if(!t)return showDialog('Record unavailable','<p>The current scope does not expose this target.</p>');const drift=t.state==='Drift detected';let body=`<div class="flex between">${badge(t.state)}<span class="mono tiny">${t.id}</span></div><dl class="kv"><div><dt>Project / environment</dt><dd>${projName(t.project)} / ${t.env}</dd></div><div><dt>Owner</dt><dd>${t.owner}</dd></div><div><dt>Approved intent</dt><dd>${t.profile} · ${t.approved}</dd></div><div><dt>Readback source</dt><dd>Target adapter · ${t.seen}</dd></div></dl><div class="panel"><div class="panelbody"><div class="coverageitem"><span>Approved release</span>${pill(t.approved)}</div><div class="coverageitem"><span>Installed revision</span>${pill(t.installed)}</div><div class="coverageitem"><span>Loaded by runtime</span>${t.loaded==='Unknown'?badge('Unknown'):pill(t.loaded)}</div><div class="coverageitem"><span>Effect exercised</span><span class="tiny muted">Separate action-level evidence</span></div></div></div><h3>Managed difference</h3>${drift?`<div class="diff-grid"><div class="diff-box before"><h4>OBSERVED · ${t.installed}</h4><pre>profile: ${t.installed}\nskill: release-checklist@1.7\n\n# unmanaged preferences\n# preserved</pre></div><div class="diff-box after"><h4>APPROVED · ${t.approved}</h4><pre>profile: ${t.approved}\nskill: release-checklist@1.8\n\n# unmanaged preferences\n# preserved</pre></div></div>`:`<div class="note ${t.loaded==='Unknown'?'purple':''}">${icon(t.loaded==='Unknown'?'question':'check')}${t.loaded==='Unknown'?'Installed state is current, but the client has not reported a fresh loaded revision. A file write cannot close this evidence gap.':'Managed installed and loaded revisions match the approved intent in this fixture.'}</div>`}<div class="note">${icon('lock')}Only the owned profile and skill reference change. No account tokens, repository-owned instructions or unmanaged settings are copied.</div>`;showDialog(t.name,body,`<small>Local mock readback only. No device is contacted.</small>${drift?actionButton('Review repair','repair-review',id,'edit','primary','arrow'):btn('Close','close','','','check')}`,{drawer:true,eyebrow:'Environment / target inspector'});}

function approvalDialog(id){const e=executionById(id);if(!e)return showDialog('Request unavailable','<p>This scope does not expose the request.</p>');const a=state.agents.find(a=>a.id===e.agent),done=e.status!=='Waiting approval';const body=`<div class="flex between">${badge(e.status)}<span class="mono tiny">${e.id}</span></div><h3>${e.amount?money(e.amount)+' · ':''}${e.action}</h3><p class="muted">Requested by ${e.requester} through ${esc(a.name)}. This request is bound to a specific resource, input fingerprint and expiry.</p><dl class="kv"><div><dt>Workspace / project</dt><dd>${wsName()} / ${projName(e.project)}</dd></div><div><dt>Environment</dt><dd>${e.env}</dd></div><div><dt>Destination</dt><dd>${e.action==='refund.create'?'Original payment method · ending 4242 (fictional)':a.resource}</dd></div><div><dt>Current authority</dt><dd>${badge(e.authority==='revoked'||(state.grantRevoked&&e.agent==='iris')?'Revoked':'Active')}</dd></div><div><dt>Policy</dt><dd class="mono">${e.policy}</dd></div><div><dt>Request expires</dt><dd>16:30 UTC · snapshot 16:00 UTC</dd></div><div><dt>Material input fingerprint</dt><dd class="mono">example:${e.id}:${e.amount}</dd></div><div><dt>Reviewer persona</dt><dd>${roles[state.role].name}</dd></div></dl><div class="note ${e.authority==='revoked'?'warn':''}">${icon('shield')}${e.authority==='revoked'?'Authority was revoked while this approval waited. An approval now must not revive that grant. The simulated decision will deny the protected effect.':'Current identity, grant, policy, connection and material inputs will be checked again before any effect is permitted.'}</div>${done?`<div class="note">${icon('file')}This local decision is recorded in Audit and on the original execution. It does not imply a real refund or deployment occurred.</div>`:`<label>Decision note<textarea id="approval-note" rows="2" placeholder="Record the business reason for this decision." required></textarea></label>${!permissions().approve?`<p class="control-hint function policyDialog(id){const isRefund=id==='refund-policy';showDialog(isRefund?'Customer refund approval':'Policy & enforcement boundary',`<div class="flex between">${badge(isRefund?'Approval required':'Enforced')}<span class="mono tiny">${esc(id)} · active revision</span></div><dl class="kv"><div><dt>Scope</dt><dd>${currentProject()} / ${state.env==='all'?'eligible environments':state.env}</dd></div><div><dt>Rule owner</dt><dd>Workspace policy team (sample)</dd></div><div><dt>Point of enforcement</dt><dd>Qualified execution adapter</dd></div><div><dt>Current revision</dt><dd>${isRefund?'v7':'v4'}</dd></div></dl><h3>Explain the decision</h3><pre class="code">${isRefund?'WHEN action = refund.create\nAND amount > USD 100\nTHEN require an eligible reviewer\n\nALWAYS bind the original payment destination\nALWAYS check current authority before effect':'WHEN resource matches the scoped grant\nAND current authority remains valid\nTHEN evaluate the operation-specific policy\n\nOTHERWISE deny the protected effect'}</pre><div class="note">${icon('file')}Illustrative policy presentation, not a released executable language. The production UI should render the canonical policy contract rather than maintain a second evaluator.</div>`,`${btn('Close','close')}${actionButton('Compare a candidate','simulation','','read','primary','play')}`,{drawer:true,eyebrow:'IAM / policy inspector'});}
function simulationDialog(){if(!requirePermission('read'))return;const rows=scopedExecutions().filter(e=>e.action==='refund.create');const results=rows.map(e=>({id:e.id,amount:e.amount,before:e.decision,after:e.authority==='revoked'||e.status==='Denied'?'Deny':e.amount>150?'Require approval':'Allow'}));let changed=results.filter(r=>r.before!==r.after);showDialog('Policy simulation · no effects',`<div class="note purple">${icon('play')}Counterfactual analysis only. No active policy, grant, receipt or external effect is modified.</div><div class="diff-grid"><div class="diff-box before"><h4>ACTIVE · refund-policy v7</h4><pre>require approval when\namount > USD 100</pre></div><div class="diff-box after"><h4>CANDIDATE · example v8</h4><pre>require approval when\namount > USD 150</pre></div></div><dl class="kv"><div><dt>Evaluated population</dt><dd>${results.length} scoped sample refund requests</dd></div><div><dt>Changed decisions</dt><dd>${changed.length}</dd></div></dl>${table(['Request','Amount','Historical decision','Candidate'],results.slice(0,12).map(r=>[r.id,money(r.amount),r.before,r.after]))}<div class="note">${icon('shield')}${results.length?'Other grant and destination restrictions remain in force. A broader threshold cannot revive revoked authority.':'This scope contains no sample refund requests. Select Customer operations / Production to inspect the comparison.'}</div>`,`<small>Historical records remain unchanged.</small>${btn('Close simulation','close','','primary','check')}`,{drawer:true,eyebrow:'Observe / compare / review'});}
function reconcileDialog(id){if(!requirePermission('edit'))return;const e=executionById(id);if(!e||e.status!=='Outcome unknown')return toast('No unresolved original operation in this scope.');showDialog('Reconcile the original operation',`<div class="note purple">${icon('question')}The provider may have completed the payment. A new request would risk a duplicate.</div><dl class="kv"><div><dt>Execution</dt><dd class="mono">${e.id}</dd></div><div><dt>Original effect identity</dt><dd class="mono">op_${e.id}</dd></div><div><dt>Amount / destination</dt><dd>${money(e.amount)} · approved vendor</dd></div><div><dt>Current state</dt><dd>${badge(e.status)}</dd></div><div><dt>Reconciliation method</dt><dd>Lookup original provider operation</dd></div><div><dt>New external write</dt><dd>No</dd></div></dl><div class="timeline"><div class="timeline-step complete"><strong>Request sent</strong><p>Original effect identity persisted before provider submission.</p></div><div class="timeline-step active"><strong>Response lost</strong><p>Outcome is unknown, not failed or safe to repeat.</p></div><div class="timeline-step"><strong>Recover the original evidence</strong><p>The mock provider lookup will recover the original completion receipt.</p></div></div>`,`<small>Simulated lookup. No provider contacted.</small>${actionButton('Check original result','reconcile-confirm',id,'edit','primary','cycle')}`,{drawer:true,eyebrow:'Runtime / effect recovery'});}
function releaseDialog(id){const p=scopedProjects().find(p=>p.id===id);if(!p)return showDialog('Release not available','<p>The current scope does not contain this project.</p>');showDialog('Change plan · '+p.profile,`<div class="flex between">${badge('Requires review')}<span class="mono tiny">${p.revision} → candidate</span></div><dl class="kv"><div><dt>Scope</dt><dd>${p.name}</dd></div><div><dt>Author</dt><dd>Project owner (fictional)</dd></div><div><dt>Impacted targets</dt><dd>${scope(state.targets).filter(t=>t.project===id).length} in current view</dd></div><div><dt>Rollback reference</dt><dd>${p.revision}</dd></div></dl><div class="diff-grid"><div class="diff-box before"><h4>ACTIVE</h4><pre>skill: release-checklist@1.7\nprofile: ${p.revision}</pre></div><div class="diff-box after"><h4>CANDIDATE</h4><pre>skill: release-checklist@1.8\nprofile: next reviewed revision</pre></div></div><h3>Activation checkpoints</h3><div class="timeline"><div class="timeline-step complete"><strong>Independent tests</strong><p>Four fixture checks: scope, unmanaged preservation, revocation and unknown outcome.</p></div><div class="timeline-step active"><strong>Review the exact candidate</strong><p>Author and publishing reviewer are separate responsibilities.</p></div><div class="timeline-step"><strong>Canary before wider rollout</strong><p>One eligible target; explicit evidence and rollback. No auto-publish from this mockup.</p></div></div><label>Review note<textarea id="release-note" rows="2" placeholder="Record the acceptance criteria or required changes."></textarea></label>`,`<small>Creates a local review record, not a deployment.</small>${actionButton('Stage reviewed change','release-confirm',id,'publish','primary','check')}`,{drawer:true,eyebrow:'Lifecycle / candidate review'});}
function learningDialog(id){const p=scopedProjects().find(p=>p.id===id);if(!p)return showDialog('Candidate unavailable','<p>This project is not in the current view.</p>');const name=id==='commerce'?'Reconcile before retrying a payment':'Preserve scoped project intent';showDialog(name,`<div class="flex between">${badge(state.learningMarks[id]?'Requires review':'Ready')}${pill('Project-only candidate')}</div><h3>Why this improvement exists</h3><p>${id==='commerce'?'A provider timeout left an original payment unresolved. The candidate adds a clear reconciliation-first instruction without granting additional payment authority.':'A repeated configuration mismatch led to an explicit managed-diff check that preserves unrelated project settings.'}</p><h3>Independent test evidence</h3>${table(['Fixture check','Expected result','Result'],[['Valid original lookup','Recover original identity',badge('Passed')],['Revoked authority','No new write allowed',badge('Passed')],['Wrong project','No cross-project access',badge('Passed')],['Lost acknowledgement','Unknown remains explicit',badge('Passed')]])}<div class="note">${icon('book')}These four results are fictional UX fixtures, not engineering acceptance evidence for a real release.</div><dl class="kv"><div><dt>Proposed audience</dt><dd>${p.name} only</dd></div><div><dt>Expansion to workspace</dt><dd>Requires a separate review</dd></div><div><dt>Source evidence</dt><dd>${id==='commerce'?'ex_1041 · original payment uncertainty':'Target/profile mismatch observation'}</dd></div><div><dt>Authority changes</dt><dd>None</dd></div></dl><label>Reviewer note<textarea id="learning-note" rows="2" placeholder="Explain the scope and why this candidate is useful."></textarea></label>`,`<small>Stages a local release candidate. Does not publish.</small>${actionButton('Stage project candidate','learning-confirm',id,'publish','primary','check')}`,{drawer:true,eyebrow:'Learning / reviewed promotion'});}
function knowledgeDialog(id){const k=scope(state.knowledge).find(x=>x.id===id);if(!k)return showDialog('Source not available','<p>The current scope does not disclose this source.</p>');showDialog(k.name,`<div class="flex between">${badge(k.state)}${pill(k.classification)}</div><dl class="kv"><div><dt>Authoritative source</dt><dd>${k.source} · source-owned content</dd></div><div><dt>Approved revision</dt><dd>${k.version}</dd></div><div><dt>Audience</dt><dd>${k.audience}</dd></div><div><dt>Owner / reviewer</dt><dd>${k.owner}</dd></div><div><dt>Derived index state</dt><dd>${k.index}</dd></div><div><dt>Selected content</dt><dd>${k.documents} mock documents</dd></div></dl><h3>Source to consumer</h3><div class="timeline"><div class="timeline-step complete"><strong>Selected source revision</strong><p>${k.source} owns the original knowledge. Private content is not copied into this prototype.</p></div><div class="timeline-step complete"><strong>Approved release ${k.version}</strong><p>Audience and reviewer are bound to this immutable revision.</p></div><div class="timeline-step complete"><strong>Derived retrieval representation</strong><p>Index points back to the release and permissioned source.</p></div><div class="timeline-step complete"><strong>Scoped consumer</strong><p>${k.audience} inside ${projName(k.project)} / ${k.env}.</p></div></div><div class="note">${icon('lock')}Changing the project/profile does not erase data already present in a model session. A clean-context requirement must be explicit.</div>`,`${btn('Close','close')}${btn('Open data lineage','data-lineage',id,'primary','branch')}`,{drawer:true,eyebrow:'Data & context / release lineage'});}
function featureDialog(id){const c=capabilities.find(c=>c.id===id);if(!c)return;showDialog(c.name,`<div class="eyebrow">${c.id} · ${domains.find(d=>d.id===c.domain).name}</div><p>${c.task}</p><dl class="kv"><div><dt>Primary object</dt><dd>${c.object}</dd></div><div><dt>Navigation home</dt><dd>${c.view}</dd></div><div class="wide"><dt>Information users need</dt><dd>${c.fields}</dd></div></dl><h3>Interaction contract</h3><p>List the relevant scoped objects, inspect one record, then show the action, required authority, expected impact and resulting evidence. Reuse the shared object detail instead of duplicating it across domains.</p><div class="note warn">${icon('shield')}${c.boundary}</div><h3>States to preserve</h3><p>Empty, denied, stale/unknown, partial and failed states are distinct from healthy data. High-impact changes need exact input review and a verifiable outcome.</p><div class="note">${icon('sliders')}This is the per-capability design contract. Supporting features are mapped here; this inspector does not imply a complete CRUD implementation or finalized plan entitlement.</div>`,`<small>Canonical ID ${c.id} stays unchanged.</small>${btn('Open mapped workspace','feature-view',c.id,'primary','arrow')}`,{drawer:true,eyebrow:'Capability / UX specification'});}
function labDialog(){showDialog('Design Lab',`<p>Change the lens to review the product experience. These controls do not represent account settings and never modify a subscription or role assignment.</p><div class="lab-columns"><div><label>Plan perspective<select id="lab-plan">${Object.entries(plans).map(([k,p])=>`<option value="${k}"${state.plan===k?' selected':''}>${p.name}${p.price?' · $'+p.price+'/mo':''}</option>`).join('')}</select></label><p class="lab-help">Solo uses the personal sample workspace with multiple projects. Team, Business and Enterprise use the shared workspace. Detailed entitlement examples remain proposals.</p></div><div><label>Persona<select id="lab-role">${Object.entries(roles).map(([k,r])=>`<option value="${k}"${state.role===k?' selected':''}>${r.name}</option>`).join('')}</select></label><p class="lab-help">Roles are independent of plans. Enterprise + Auditor is read-only, with scoped evidence export; Billing admin cannot inspect operational records.</p></div></div><label>Data state<select id="lab-state">${[['populated','Populated sample'],['empty','Empty / first-run'],['stale','Partial / stale observation'],['error','Load error']].map(([k,l])=>`<option value="${k}"${state.viewState===k?' selected':''}>${l}</option>`).join('')}</select></label><div class="note warn">${icon('sliders')}All data is fictional. Approval, repair and reconciliation changes exist only in this browser session. Refreshing resets them.</div>`,`${btn('Reset demo','reset','','','cycle')}${btn('Apply perspective','apply-lab','','primary','check')}`);}

function searchDialog(){if(!dialog.open)previousFocus=document.activeElement;dialog.className='';dialog.innerHTML=`<div class="command-search">${icon('search')}<input id="command-query" aria-label="Search workspace and capabilities" placeholder="Find agents, policies, approvals, capabilities…" autocomplete="off">${ib('close','close','Close search')}</div><div class="command-results" id="command-results"></div><div class="commandhint">⌘ / Ctrl K to open · Arrow keys or Tab to move · Enter to open · Esc to close</div>`;dialog.setAttribute('aria-label','Search workspace');dialog.removeAttribute('aria-labelledby');if(!dialog.open)dialog.showModal();searchResults('');document.getElementById('command-query').focus();}
function searchResults(q){const base=[{name:'Workspace overview',type:'Page',route:'overview',ic:'home'},...domains.map(d=>({name:d.name,type:'Domain',route:d.route,ic:d.icon})),{name:'Approvals',type:'Page',route:'approvals',ic:'shield'},{name:'Usage & billing',type:'Page',route:'usage',ic:'wallet'},...capabilities.map(c=>({name:c.id+' · '+c.name,type:'Capability',act:'feature',id:c.id,ic:'grid'})),...scopedAgents().map(a=>({name:a.name+' · '+a.purpose,type:'Agent',route:'agents/'+a.id,ic:'bot'})),...scopedExecutions().slice(0,10).map(e=>({name:e.id+' · '+e.action,type:'Execution',route:'execution/'+e.id,ic:'activity'}))];let result=base.filter(x=>!q||x.name.toLowerCase().includes(q.toLowerCase())).slice(0,12);document.getElementById('command-results').innerHTML=result.length?result.map(x=>`<a ${x.route?`href="#/${x.route}"`:`href="#" data-act="${x.act}" data-id="${x.id}"`}>${icon(x.ic)}${esc(x.name)}<span class="tiny">${x.type}</span></a>`).join(''):'<div class="empty"><p>No permitted results match this search.</p></div>';}
function downloadJSON(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}

function suspendDialog(id){if(!requirePermission('edit'))return;const a=agentById(id);if(!a)return;showDialog('Review binding suspension',`<h3>${esc(a.name)} · ${projName(a.project)}</h3><p>Pause future governed use of this one binding. Do not delete history, reverse completed actions or claim that an external provider has stopped.</p><dl class="kv"><div><dt>Scope</dt><dd>${projName(a.project)} / ${a.env}</dd></div><div><dt>Impacted binding</dt><dd>1 · ${a.id}</dd></div><div><dt>Uncertain operations</dt><dd>${scope(state.executions).filter(e=>e.agent===a.id&&e.status==='Outcome unknown').length} remain available for reconciliation</dd></div><div><dt>Upstream account</dt><dd>Not revoked by this operation</dd></div></dl><label>Reason<textarea id="suspend-note" rows="2" placeholder="Why should future governed use pause?"></textarea></label>`,`${btn('Cancel','close')}${btn('Simulate scoped suspension','suspend-confirm',id,'danger','pause')}`,{drawer:true});}
function enterpriseDialog(kind){if(state.plan!=='enterprise'||!permissions().read)return planGate('Enterprise identity');const isReview=kind==='access-review';showDialog(isReview?'Organization access review':'Enterprise identity configuration',isReview?`<p>Proposed design for evidence-driven access certification, using synthetic assignments.</p>${table(['Review item','Assigned reviewer','Recommendation','Effect state'],[['Iris / refund access','Sam Ortiz','Retain narrower scope','No change requested'],['Scout / inactive observation','Riley Brooks','Investigate stale evidence','Unknown; not assumed inactive'],['Ledger / finance connection','Avery Chen','Review expiry','No grant removed']])}<div class="note">${icon('shield')}A reviewer’s recommendation is distinct from a verified revocation. The production design must show downstream effect acknowledgement.</div>`:`<dl class="kv"><div><dt>Identity provider</dt><dd>Organization-configured · no provider connected</dd></div><div><dt>Authentication</dt><dd>SSO setup and domain verification</dd></div><div><dt>Provisioning</dt><dd>Scoped membership mapping and lifecycle preview</dd></div><div><dt>Role mapping</dt><dd>No privilege from plan selection alone</dd></div></dl><div class="note">${icon('lock')}This is an inspection state, not a functional identity-provider connection form. Configuration changes require separate administrative authority.</div>`,`${btn('Close','close')}${btn('Inspect role permissions','persona','','primary','key')}`,{drawer:true,eyebrow:'Enterprise / proposed design'});}
function planGate(name){showDialog('Plan scope is not role authority',`<h3>${esc(name)}</h3><p>This prototype places advanced organization settings in the Enterprise perspective. Detailed entitlements are a design proposal—not an approved commercial contract.</p><dl class="kv"><div><dt>Current plan lens</dt><dd>${plans[state.plan].name}</dd></div><div><dt>Current persona</dt><dd>${roles[state.role].name}</dd></div><div><dt>Operational access</dt><dd>${permissions().read?'Scoped read granted':'Not granted by this persona'}</dd></div></dl><div class="note">${icon('key')}Changing plan in the Design Lab retains your role. A billing administrator does not receive operational access by upgrading.</div>`,`${btn('Close','close')}${btn('Compare perspectives','lab','','primary','sliders')}`);}
function applyPerspective(plan,role,view){if(!plans[plan]||!roles[role]||!['populated','empty','stale','error'].includes(view))return;state.plan=plan;state.role=role;state.viewState=view;state.workspace=plan==='solo'?'personal':'meridian';resetFilters();state.tabs={};closeDialog();navigate(role==='billing'?'usage':'overview');toast(`${plans[plan].name} · ${roles[role].name}. Demo perspective only.`);}
function resetDemo(){state={workspace:'meridian',project:'all',env:'all',plan:'business',role:'admin',viewState:'populated',range:'24',query:'',filter:'all',tabs:{},agents:structuredClone(initialAgents),executions:seedExecutions(),targets:structuredClone(initialTargets),knowledge:structuredClone(initialKnowledge),audit:[],grantRevoked:false,viewSaved:false,traceSpan:0,historyStep:0,simulation:false,learningMarks:{},releaseMarks:{}};navigate('overview');toast('Fictional workspace reset. No external state changed.');}
function decideApproval(id,approve){if(!requirePermission('approve'))return;const e=executionById(id),note=noteRequired('approval-note');if(!e||!note)return;if(e.status!=='Waiting approval')return toast('This request has already been decided.');if(dialog.dataset.fingerprint!==JSON.stringify([e.id,e.amount,e.policy,e.project,e.env]))return toast('Request changed. Review the current material inputs before deciding.');const revoked=e.authority==='revoked'||(state.grantRevoked&&e.agent==='iris');e.reviewed=true;e.reviewNote=note;e.reviewResult=approve&&!revoked?'Approved':'Denied';e.status=approve&&!revoked?'Completed':'Denied';e.decision=approve&&!revoked?'Allow':'Deny';if(revoked)e.authority='revoked';if(e.status==='Completed')e.duration=320;record(revoked?'approval.authority_revoked':approve?'approval.decided':'approval.denied',e,e.status,note+(revoked?' · Current authority check denied the effect.':''));render();approvalDialog(id);toast(revoked?'Current authority is revoked. Protected effect denied.':approve?'Local request approved; synthetic completion recorded.':'Local request denied.');}
function handleAction(act,id){switch(act){
 case 'close':return closeDialog();case 'navigate':return navigate(id);case 'workspace':return workspaceDialog();
 case 'select-workspace':if(!['meridian','personal'].includes(id))return;if(state.plan==='solo'&&id==='meridian')return planGate('Shared workspace');state.workspace=id;resetFilters();navigate(permissions().read?'overview':'usage');return;
 case 'tab':{const [r,t]=id.split('|');state.tabs[r]=t;state.query='';state.filter='all';render();return;}
 case 'mobile':{const s=document.getElementById('sidebar'),b=document.querySelector('[data-act="mobile"]');s.classList.toggle('open');b.setAttribute('aria-expanded',s.classList.contains('open'));return;}
 case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('driftgate-app-theme',document.documentElement.dataset.theme);}catch{}render();return;
 case 'search':return searchDialog();case 'launcher':return launcherDialog();case 'persona':return personaDialog();case 'lab':return labDialog();
 case 'apply-lab':return applyPerspective(document.getElementById('lab-plan').value,document.getElementById('lab-role').value,document.getElementById('lab-state').value);
 case 'plan':return applyPerspective(id,state.role,state.viewState);case 'plan-comparison':closeDialog();navigate('usage');return;
 case 'reset':return resetDemo();case 'retry-data':state.viewState='populated';render();return;
 case 'clear':state.query='';state.filter='all';render();return;
 case 'save-view':if(state.savedView){const v=state.savedView;if(v.workspace!==state.workspace)return toast('Saved view belongs to a different workspace.');Object.assign(state,{project:v.project,env:v.env,query:v.query,filter:v.filter,range:v.range});render();toast('Local saved filters restored.');}else{state.savedView={workspace:state.workspace,project:state.project,env:state.env,query:state.query,filter:state.filter,range:state.range};state.viewSaved=true;render();toast('View saved for this browser session.');}return;
 case 'chart-table':{const gs=chartData();return showDialog('Action volume · accessible data',`<p>Same ${scopedExecutions().length} records, ${state.range==='1'?'one-hour':'24-hour'} sample window. Buckets are chronological, oldest to newest.</p>${table(['Bucket','Completed','Denied / failed','Waiting','Unknown'],gs.map(g=>[g.label,g.complete,g.denied,g.wait,g.unknown]))}`,btn('Close','close'));}
 case 'project':{const p=projects.find(p=>p.id===id&&p.workspace===state.workspace);if(!p||!permissions().read)return;state.project=id;state.env='all';navigate('environments');return;}
 case 'resolution':return showDialog('Effective environment resolution',`<p>Inspect the resolved layers for ${currentProject()}. Lower layers cannot weaken mandatory restrictions above them.</p><div class="timeline">${[['Workspace','Reusable approved baseline and mandatory policy'],['Project','Explicit resource bindings, repository source and profile'],['Profile release','Immutable intent; drafts do not change active targets'],['Client representation','Supported model, tools and instructions for this client'],['Target overlay','Intentional device differences; independently authorized account'],['Task overlay','Bounded extra restrictions, never ambient authority']].map(([a,b])=>`<div class="timeline-step complete"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div>`,btn('Inspect project profiles','navigate','projects','primary','arrow'),{drawer:true});
 case 'onboarding':return onboardingDialog();case 'onboarding-projects':state.viewState='populated';navigate('projects');return;
 case 'register':return registerDialog();case 'register-confirm':{if(!requirePermission('edit'))return;const name=noteRequired('new-agent-name'),purpose=noteRequired('new-agent-purpose'),projectId=document.getElementById('new-agent-project')?.value,p=scopedProjects().find(p=>p.id===projectId);if(!name||!purpose||!p)return;const a={id:'demo-agent-'+state.agents.length,name,purpose,workspace:p.workspace,project:p.id,env:state.env==='all'?'development':state.env,owner:'Alex Morgan',provider:'Not connected',mode:'Unknown',last:'Not observed',profile:p.revision,kind:'Unconnected agent',grant:'None',resource:'No resource granted',tone:'atlas'};state.agents.push(a);record('agent.registered',a,'Recorded','Local record only; no connection or grant created.');navigate('agents/'+a.id);toast('Sample agent registered without authority.');return;}
 case 'artifact':return artifactDialog(id);case 'target':return targetDialog(id);case 'repair-review':return repairReview(id);
 case 'repair-confirm':{if(!requirePermission('edit'))return;const t=targetById(id),note=noteRequired('repair-reason');if(!t||!note)return;if(t.state!=='Drift detected'||t.installed!==dialog.dataset.expected)return toast('Observed revision changed. Reinspect rather than overwrite it.');const prior=t.installed;t.installed=t.approved;t.loaded=t.approved;t.state='Verified';t.seen='16:00 UTC';t.previousRevision=prior;record('environment.repair_verified',t,'Verified',`${note} · ${prior} → ${t.approved}; unmanaged fields retained.`);render();targetDialog(id);toast('Local repair verified; other targets unchanged.');return;}
 case 'approval':return approvalDialog(id);case 'approve':return decideApproval(id,true);case 'deny':return decideApproval(id,false);
 case 'authority':return authorityDialog(id);case 'revoke-grant':{if(!requirePermission('publish'))return;const a=agentById(id);if(!a||a.id!=='iris')return;state.grantRevoked=true;state.executions.filter(e=>e.workspace===a.workspace&&e.agent===a.id&&e.status==='Waiting approval').forEach(e=>e.authority='revoked');record('grant.revoked',a,'Revoked','Future governed use for this agent grant only; pending requests require a fresh check.');render();authorityDialog(id);toast('Local Iris grant revoked. No other agent grant changed.');return;}
 case 'policy':return policyDialog(id);case 'simulation':return simulationDialog();
 case 'reconcile':return reconcileDialog(id);case 'reconcile-confirm':{if(!requirePermission('edit'))return;const e=executionById(id);if(!e||e.status!=='Outcome unknown')return toast('There is no unknown original effect to reconcile.');e.status='Completed';e.reconciled=true;record('execution.reconciled',e,'Reconciled','Original provider operation confirmed. No new execution or external write was created.');render();showDialog('Original outcome recovered',`<div class="note">${icon('check')}The fictional provider lookup confirms the original payment completed. No second payment was requested.</div><dl class="kv"><div><dt>Original operation</dt><dd>${e.id}</dd></div><div><dt>Effect state</dt><dd>${badge('Completed')}</dd></div><div><dt>New writes</dt><dd>0</dd></div><div><dt>Original identity</dt><dd>Preserved</dd></div></dl>`,link('Inspect original receipt','execution/'+id,'btn primary','arrow'),{drawer:true});toast('Original effect reconciled, without a new write.');return;}
 case 'span':state.traceSpan=Math.max(0,Math.min(4,Number(id)));render();return;
 case 'history':state.tabs.execution='History';state.historyStep=0;navigate('execution/'+id);return;
 case 'history-next':state.historyStep=Math.min(3,state.historyStep+1);render();return;case 'history-prev':state.historyStep=Math.max(0,state.historyStep-1);render();return;
 case 'history-picker':return showDialog('Inspect recorded execution history',`<p>Choose an existing execution. This is read-only history, not a re-run.</p>${table(['Operation','State',''],scopedExecutions().slice(0,7).map(e=>[e.id+' · '+e.action,badge(e.status),btn('Inspect history','history',e.id,'small','clock')]))}`,btn('Close','close'));
 case 'copy':return copyText(id);case 'export':{if(!requirePermission('export'))return;let data;if(id==='audit')data=auditRows();else{const e=executionById(id),a=e&&agentById(e.agent);if(!e||!a)return toast('The record is not permitted in this scope.');data=receiptObject(e,a);}downloadJSON('DriftGate-Mock-Evidence.json',{sample:true,exportedBy:roles[state.role].name,scope:{workspace:state.workspace,project:state.project,environment:state.env},data});toast('Only scoped fictional evidence exported.');return;}
 case 'audit':return auditDialog(id);case 'graph-agent':if(agentById(id)){state.graphAgent=id;render();}return;case 'graph-node':return graphNode(id);case 'relationships':return relationshipsDialog(id);case 'connection':return connectionDialog(id);
 case 'suspend':return suspendDialog(id);case 'suspend-confirm':{if(!requirePermission('edit'))return;const a=agentById(id),note=noteRequired('suspend-note');if(!a||!note)return;a.mode='Suspended';record('binding.suspended',a,'Recorded',note+' · No upstream revocation or effect reversal.');navigate('agents/'+a.id);toast('One local binding suspended. Existing history retained.');return;}
 case 'rotation':{const a=agentById(id);if(!a)return;return showDialog('Credential rotation plan',`<h3>${esc(a.name)} · ${a.provider}</h3><p>Inspect consumers → request a replacement with the provider → verify the replacement → update opaque references → retire the old credential after impact checks.</p><div class="note">${icon('key')}No secret values are displayed and no provider is contacted. Rotation and revocation are distinct operations.</div>`,btn('Inspect lifecycle contract','feature','L06','primary','arrow'),{drawer:true});}
 case 'release':return releaseDialog(id);case 'release-confirm':{if(!requirePermission('publish'))return;const p=scopedProjects().find(p=>p.id===id),note=noteRequired('release-note');if(!p||!note)return;state.releaseMarks[id]=true;record('release.review_staged',projectEntity(p),'Requires review',note+' · Candidate staged; active revision unchanged.');closeDialog();render();toast('Reviewed change staged locally. Active targets unchanged.');return;}
 case 'learning':return learningDialog(id);case 'learning-confirm':{if(!requirePermission('publish'))return;const p=scopedProjects().find(p=>p.id===id),note=noteRequired('learning-note');if(!p||!note)return;state.learningMarks[id]=true;state.releaseMarks[id]=true;record('learning.candidate_staged',projectEntity(p),'Requires review',note+' · Project scope only; no active release or knowledge changed.');closeDialog();render();toast('Project candidate staged; no cross-project sharing.');return;}
 case 'knowledge':return knowledgeDialog(id);case 'data-lineage':if(scope(state.knowledge).find(k=>k.id===id)){state.lineageKnowledgeId=id;state.tabs.data='Lineage';navigate('data');}return;
 case 'feature':return featureDialog(id);case 'feature-view':{const c=capabilities.find(c=>c.id===id);if(!c)return;const d=domains.find(d=>d.route===c.route);if(d&&d.tabs.includes(c.view))state.tabs[c.route]=c.view;if(c.id==='E02')state.tabs.approvals='Needs review';navigate(c.route);return;}
 case 'enterprise-config':case 'access-review':return enterpriseDialog(act);case 'plan-gate':return planGate(id);
 default:console.warn('Unmapped prototype action:',act);toast('This interaction is described in the capability explorer.');
}}
// Stable delegated handlers survive route rendering; no application API is called.
document.addEventListener('click',event=>{const action=event.target.closest('[data-act]');if(action){event.preventDefault();if(action.disabled)return;return handleAction(action.dataset.act,action.dataset.id||'');}const a=event.target.closest('a[href^="#/"]');if(a){closeDialog();state.query='';state.filter='all';if(location.hash===a.getAttribute('href')){render();window.scrollTo(0,0);}}if(!event.target.closest('.sidebar')&&!event.target.closest('[data-act="mobile"]'))document.getElementById('sidebar')?.classList.remove('open');});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='command-query')return searchResults(el.value);if(el.id==='table-query'){const cursor=el.selectionStart;state.query=el.value;render();const next=document.getElementById('table-query');next?.focus();try{next?.setSelectionRange(cursor,cursor);}catch{}}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='project-scope'){if(el.value!=='all'&&!projects.some(p=>p.workspace===state.workspace&&p.id===el.value))return;state.project=el.value;changeScope();}else if(el.id==='environment-scope'){if(!['all','production','staging','development'].includes(el.value))return;state.env=el.value;changeScope();}else if(el.id==='status-filter'){state.filter=el.value;render();}else if(el.id==='time-window'){state.range=el.value==='1'?'1':'24';render();}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();searchDialog();return;}if(event.key==='Escape'){if(dialog.open){event.preventDefault();closeDialog();}document.getElementById('sidebar')?.classList.remove('open');}if(dialog.open&&document.getElementById('command-query')&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const links=[...document.querySelectorAll('#command-results a')],i=links.indexOf(document.activeElement);if(links.length)links[(i+(event.key==='ArrowDown'?1:links.length-1)+links.length)%links.length].focus();}});
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog();}});
dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
window.addEventListener('hashchange',()=>{closeDialog();state.query='';state.filter='all';render();window.scrollTo(0,0);});
try{const theme=localStorage.getItem('driftgate-app-theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch{}
render();
</script></body></html>
